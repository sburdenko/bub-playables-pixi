name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # The art is third-party and lives in a private repository; a read-only deploy key fetches it.
      - name: Check out source art
        uses: actions/checkout@v5
        with:
          repository: sburdenko/bub-playables-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets-src

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (assets, lint, typecheck, coverage, builds, size, e2e)
        run: npm run verify

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Package site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Deploy latest build
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
